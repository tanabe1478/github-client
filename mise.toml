[tools."http:moonbit"]
version = "0.10.14+7d59c7ec9"
bin_path = "bin"
postinstall = '''
set -eu
root="$MISE_TOOL_INSTALL_PATH"
core_archive="$root/lib/core.tar.gz"

chmod +x "$root"/bin/* "$root/bin/internal/tcc"
ln -sfn moon "$root/bin/moonx"

curl -fsSLo "$core_archive" \
  "https://cli.moonbitlang.com/cores/core-0.10.14%2B7d59c7ec9.tar.gz"
printf '%s  %s\n' \
  "6f18b8fdea18f85e628a75e4a1bd3977c5a5c9c6a836fd8824192b0e6bd91b14" \
  "$core_archive" | shasum -a 256 -c -
rm -rf "$root/lib/core"
tar -xzf "$core_archive" -C "$root/lib"
rm "$core_archive"

MOON_HOME="$root" PATH="$root/bin:$PATH" \
  "$root/bin/moon" -C "$root/lib/core" bundle --warn-list -a --all
MOON_HOME="$root" PATH="$root/bin:$PATH" \
  "$root/bin/moon" -C "$root/lib/core" bundle --warn-list -a --target wasm-gc --quiet
'''

[tools."http:moonbit".platforms]
macos-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.14%2B7d59c7ec9/moonbit-darwin-aarch64.tar.gz", checksum = "sha256:20967f9389ac54508899ee2fc051a3470d051452bac5818a9696ed4c144f3ec3" }

[env]
MOON_HOME = { value = '{{ tools["http:moonbit"].path }}', tools = true }
